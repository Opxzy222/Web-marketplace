<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>marketplace</title>

    <!-- Status bar & address bar color -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a"   media="(prefers-color-scheme: dark)" />

    <!-- Tells browsers we support both modes -->
    <meta name="color-scheme" content="light dark" />

    <!-- iOS Safari status bar style (best compromise) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Prevent FOUC – apply dark class as early as possible -->
    <script>
      (function() {
        // This runs synchronously before paint
        const saved = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        let isDark = false;

        if (saved === 'dark') {
          isDark = true;
        } else if (saved === 'light') {
          isDark = false;
        } else {
          // 'system' or unset → follow system
          isDark = prefersDark;
        }

        if (isDark) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
