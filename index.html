<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- Viewport – optimized for mobile & PWA -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />

    <title>marketplace</title>

    <!-- PWA manifest (required for installability + Android theme color) -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme color – status bar (Android), address bar, and iOS when respected -->
    <meta name="theme-color" content="#1E3A8A" />

    <!-- Modern/standard full-screen PWA mode (replaces deprecated apple- version) -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS status bar appearance – "default" shows the #1E3A8A color -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Tells browsers we support both light and dark modes -->
    <meta name="color-scheme" content="light dark" />

    <!-- Prevent FOUC – apply dark mode class synchronously before paint -->
    <script>
      (function() {
        const saved = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        let isDark = false;

        if (saved === 'dark') {
          isDark = true;
        } else if (saved === 'light') {
          isDark = false;
        } else {
          // 'system' or unset → follow system preference
          isDark = prefersDark;
        }

        if (isDark) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
