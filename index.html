<!doctype html>
<html lang="en" class="ind-app">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- Optimized viewport for mobile & PWA -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />

    <title>marketplace</title>

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme color – Android status bar / address bar -->
    <meta name="theme-color" content="#1E3A8A" />

    <!-- Modern full-screen PWA capability -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS status bar – "default" allows theme-color to show -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Color scheme support -->
    <meta name="color-scheme" content="light dark" />

    <!-- Prevent FOUC – apply dark class early -->
    <script>
      (function() {
        const saved = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        let isDark = saved === 'dark' || (!saved && prefersDark);
        if (isDark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
